name: Actualizar precios

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 8:00 de Argentina (11:00 UTC)
  workflow_dispatch:        # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install pandas requests

      - name: Descargar, filtrar y cargar en Supabase
        run: python robot/actualizar_precios.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Guardar una copia de los datos en el repositorio
        run: |
          git config user.name "robot-precios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/estaciones_v2.csv
          git diff --cached --quiet || git commit -m "Precios actualizados $(date -u +%F)"
          git push
